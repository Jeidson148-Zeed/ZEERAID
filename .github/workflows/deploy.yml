name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            # 1. Entrar na pasta do projeto
            cd ${{ secrets.VM_PROJECT_PATH }}

            # 2. Baixar o código mais recente
            git pull origin main

            # 3. Instalar/atualizar dependências
            npm install

            # 4. Instalar PM2 globalmente se não existir
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 5. Reiniciar ou iniciar o app com PM2
            pm2 describe zeeraid > /dev/null 2>&1 \
              && pm2 restart zeeraid \
              || pm2 start npm --name "zeeraid" -- run dev -- --host 0.0.0.0 --port 5173

            # 6. Salvar configuração do PM2 para sobreviver a reboots
            pm2 save
